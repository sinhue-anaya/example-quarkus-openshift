# =============================================================================
# OpenShift Manifest — code-with-quarkus (Quarkus Native)
# Compatible con CRC (Red Hat CodeReady Containers)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Namespace / Proyecto
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: code-with-quarkus
---
# -----------------------------------------------------------------------------
# 2. ImageStream — registra la imagen dentro de OpenShift
# -----------------------------------------------------------------------------
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: code-with-quarkus
  namespace: code-with-quarkus
spec:
  lookupPolicy:
    local: true
---
# -----------------------------------------------------------------------------
# 3. Deployment — define cómo correr el contenedor
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-with-quarkus
  namespace: code-with-quarkus
  labels:
    app: code-with-quarkus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-with-quarkus
  template:
    metadata:
      labels:
        app: code-with-quarkus
    spec:
      # OpenShift asigna automáticamente un UID del rango del namespace
      # NO fijar runAsUser — CRC usa el rango 1000700000-1000709999
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: code-with-quarkus
          image: image-registry.openshift-image-registry.svc:5000/code-with-quarkus/code-with-quarkus:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_HOST
              value: "0.0.0.0"
            - name: QUARKUS_HTTP_PORT
              value: "8080"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
# -----------------------------------------------------------------------------
# 4. Service — expone el Deployment internamente en el cluster
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: code-with-quarkus
  namespace: code-with-quarkus
  labels:
    app: code-with-quarkus
spec:
  selector:
    app: code-with-quarkus
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# -----------------------------------------------------------------------------
# 5. Route — expone el servicio al exterior con la URL de CRC
# -----------------------------------------------------------------------------
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: code-with-quarkus
  namespace: code-with-quarkus
  labels:
    app: code-with-quarkus
spec:
  host: code-with-quarkus.apps-crc.testing
  to:
    kind: Service
    name: code-with-quarkus
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect