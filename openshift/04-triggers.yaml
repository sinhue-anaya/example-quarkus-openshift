# TriggerBinding: extrae datos del payload del webhook de GitHub
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
  namespace: mi-namespace
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)

---
# TriggerTemplate: define cómo crear el PipelineRun al recibir el webhook
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: quarkus-pipeline-template
  namespace: mi-namespace
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        # Nombre único por ejecución usando timestamp
        generateName: quarkus-native-pipeline-run-
        namespace: mi-namespace
      spec:
        serviceAccountName: pipeline-sa
        pipelineRef:
          name: quarkus-native-pipeline
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-name
            value: image-registry.openshift-image-registry.svc:5000/mi-namespace/mi-app-quarkus
        workspaces:
          - name: source
            persistentVolumeClaim:
              claimName: pipeline-workspace
        # Timeout generoso por el build nativo con GraalVM
        timeouts:
          pipeline: 1h

---
# EventListener: el endpoint que recibe el webhook de GitHub
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-event-listener
  namespace: mi-namespace
spec:
  serviceAccountName: pipeline-sa
  triggers:
    - name: github-push-trigger
      interceptors:
        # Filtra solo eventos de push (no PRs, no issues, etc.)
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: eventTypes
              value: ["push"]
            # Descomenta y agrega tu secret si quieres validar el webhook:
            # - name: secretRef
            #   value:
            #     secretName: github-webhook-secret
            #     secretKey: secret
      bindings:
        - ref: github-push-binding
      template:
        ref: quarkus-pipeline-template

---
# Route para exponer el EventListener a internet (necesario para el webhook de GitHub)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: github-event-listener
  namespace: mi-namespace
spec:
  to:
    kind: Service
    name: el-github-event-listener
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
