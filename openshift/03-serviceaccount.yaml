# ServiceAccount que usará el pipeline
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-sa
  namespace: mi-namespace

---
# Permiso para hacer push al registry interno de OpenShift
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-sa-registry
  namespace: mi-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: pipeline-sa
    namespace: mi-namespace

---
# Permiso para que el pipeline pueda hacer push de imágenes
# (imagen a imagen-registry interno de OpenShift)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-sa-image-builder
  namespace: mi-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: pipeline-sa
    namespace: mi-namespace

---
# Permiso para que el pipeline pueda hacer deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-sa-deployer
  namespace: mi-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:deployer
subjects:
  - kind: ServiceAccount
    name: pipeline-sa
    namespace: mi-namespace
